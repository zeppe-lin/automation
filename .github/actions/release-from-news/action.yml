name: Publish release from NEWS
description: Publish the tagged NEWS section and queue central release delivery

inputs:
  tag:
    description: Release tag, including the leading v
    required: true
  news:
    description: Path to NEWS.md in the checked-out caller repository
    required: false
    default: NEWS.md
  release-name:
    description: Release title; defaults to the tag
    required: false
    default: ""
  prerelease:
    description: Mark the GitHub release as a prerelease
    required: false
    default: "false"
  github-token:
    description: Caller repository token used to publish the GitHub release
    required: true
  dispatch-token:
    description: Token permitted to dispatch zeppe-lin/automation
    required: true
  repository:
    description: Caller repository in owner/name form
    required: true

runs:
  using: composite
  steps:
    - name: Extract release notes
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        NEWS_PATH: ${{ inputs.news }}
      run: >-
        python3 "$GITHUB_ACTION_PATH/../../../libexec/extract-news.py"
        "$RELEASE_TAG" "$NEWS_PATH" "$RUNNER_TEMP/release-notes.md"

    - name: Publish GitHub release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_NAME: ${{ inputs.release-name }}
        RELEASE_PRERELEASE: ${{ inputs.prerelease }}
      run: >-
        python3 "$GITHUB_ACTION_PATH/../../../libexec/publish-github-release.py"
        "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md"

    - name: Queue central announcement delivery
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.dispatch-token }}
        SOURCE_REPOSITORY: ${{ inputs.repository }}
        RELEASE_TAG: ${{ inputs.tag }}
      run: >-
        python3 "$GITHUB_ACTION_PATH/../../../libexec/queue-release-delivery.py"
        "$SOURCE_REPOSITORY" "$RELEASE_TAG"
