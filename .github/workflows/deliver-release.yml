name: Deliver release announcement

on:
  repository_dispatch:
    types:
      - release-published
  workflow_dispatch:
    inputs:
      repository:
        description: Source repository, for example zeppe-lin/pkgman
        required: true
        type: string
      tag:
        description: Published release tag, for example v6.3
        required: true
        type: string
      deliver:
        description: Perform external delivery instead of dry-run rendering
        required: false
        default: false
        type: boolean
      force_replay:
        description: Replay unresolved destinations explicitly
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-delivery
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: ${{ github.event.client_payload.repository || inputs.repository }}
  RELEASE_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
  AUTOMATION_FORCE_REPLAY: ${{ github.event_name == 'workflow_dispatch' && inputs.force_replay == true }}
  AUTOMATION_STATE_REPOSITORY: .
  AUTOMATION_STATE_REMOTE: origin
  AUTOMATION_STATE_SHA: ${{ github.sha }}
  AUTOMATION_RUN_ID: ${{ github.run_id }}
  AUTOMATION_RUN_ATTEMPT: ${{ github.run_attempt }}

jobs:
  prepare:
    name: prepare release announcement
    runs-on: ubuntu-latest

    steps:
      - name: Checkout automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Prepare release announcement
        run: python3 libexec/prepare-release.py "$SOURCE_REPOSITORY" "$RELEASE_TAG" "$RUNNER_TEMP/release-delivery"

      - name: Upload rendered delivery artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-delivery-${{ github.run_id }}
          path: ${{ runner.temp }}/release-delivery
          if-no-files-found: error
          retention-days: 90

  mail-user:
    name: deliver user-list release announcement
    needs: prepare
    if: ${{ github.event_name == 'repository_dispatch' || inputs.deliver == true }}
    runs-on: ${{ fromJSON(vars.DELIVERY_RUNNER || '"ubuntu-latest"') }}
    permissions:
      contents: write

    steps:
      - name: Checkout automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download rendered delivery artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-delivery-${{ github.run_id }}
          path: release-delivery

      - name: Deliver user-list mail
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURITY: ${{ vars.SMTP_SECURITY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_TO: ${{ vars.MAIL_USER_TO }}
        run: python3 libexec/deliver-release.py release-delivery mail-user

  mail-dev:
    name: deliver development-list release announcement
    needs:
      - prepare
      - mail-user
    if: ${{ always() && needs.prepare.result == 'success' && (github.event_name == 'repository_dispatch' || inputs.deliver == true) }}
    runs-on: ${{ fromJSON(vars.DELIVERY_RUNNER || '"ubuntu-latest"') }}
    permissions:
      contents: write

    steps:
      - name: Checkout automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download rendered delivery artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-delivery-${{ github.run_id }}
          path: release-delivery

      - name: Deliver development-list mail
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURITY: ${{ vars.SMTP_SECURITY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_TO: ${{ vars.MAIL_DEV_TO }}
        run: python3 libexec/deliver-release.py release-delivery mail-dev

  irc:
    name: deliver IRC release announcement
    needs:
      - prepare
      - mail-dev
    if: ${{ always() && needs.prepare.result == 'success' && (github.event_name == 'repository_dispatch' || inputs.deliver == true) }}
    runs-on: ${{ fromJSON(vars.DELIVERY_RUNNER || '"ubuntu-latest"') }}
    permissions:
      contents: write

    steps:
      - name: Checkout automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download rendered delivery artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-delivery-${{ github.run_id }}
          path: release-delivery

      - name: Deliver IRC announcement
        env:
          IRC_HOST: ${{ vars.IRC_HOST }}
          IRC_PORT: ${{ vars.IRC_PORT }}
          IRC_CHANNEL: ${{ vars.IRC_CHANNEL }}
          IRC_NICK: ${{ vars.IRC_NICK }}
          IRC_USERNAME: ${{ vars.IRC_USERNAME }}
          IRC_SASL_USERNAME: ${{ vars.IRC_SASL_USERNAME }}
          IRC_SASL_PASSWORD: ${{ secrets.IRC_SASL_PASSWORD }}
        run: python3 libexec/deliver-release.py release-delivery irc
