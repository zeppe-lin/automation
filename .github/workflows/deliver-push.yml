name: Deliver push notifications

on:
  repository_dispatch:
    types:
      - push-observed

permissions:
  contents: read

concurrency:
  group: push-delivery
  cancel-in-progress: false
  queue: max

env:
  AUTOMATION_STATE_REPOSITORY: .
  AUTOMATION_STATE_REMOTE: origin
  AUTOMATION_STATE_SHA: ${{ github.sha }}
  AUTOMATION_RUN_ID: ${{ github.run_id }}
  AUTOMATION_RUN_ATTEMPT: ${{ github.run_attempt }}

jobs:
  prepare:
    name: prepare push notifications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Prepare push event
        run: python3 libexec/prepare-github-push.py "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/source.git" "$RUNNER_TEMP/push-delivery"

      - name: Upload rendered delivery artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: push-delivery-${{ github.run_id }}
          path: ${{ runner.temp }}/push-delivery
          if-no-files-found: error
          retention-days: 90

  mail-dev:
    name: deliver development-list push mail
    needs: prepare
    if: ${{ vars.PUSH_DELIVERY_ENABLED == 'true' }}
    runs-on: ${{ fromJSON(vars.DELIVERY_RUNNER || '"ubuntu-latest"') }}
    permissions:
      contents: write

    steps:
      - name: Checkout automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download rendered delivery artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: push-delivery-${{ github.run_id }}
          path: push-delivery

      - name: Deliver development-list mail
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURITY: ${{ vars.SMTP_SECURITY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_TO: ${{ vars.MAIL_DEV_TO }}
        run: python3 libexec/deliver-push.py push-delivery mail-dev

  mail-user:
    name: deliver user-list push mail
    needs:
      - prepare
      - mail-dev
    if: ${{ always() && needs.prepare.result == 'success' && vars.PUSH_DELIVERY_ENABLED == 'true' }}
    runs-on: ${{ fromJSON(vars.DELIVERY_RUNNER || '"ubuntu-latest"') }}
    permissions:
      contents: write

    steps:
      - name: Checkout automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download rendered delivery artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: push-delivery-${{ github.run_id }}
          path: push-delivery

      - name: Deliver user-list mail
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURITY: ${{ vars.SMTP_SECURITY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_TO: ${{ vars.MAIL_USER_TO }}
        run: python3 libexec/deliver-push.py push-delivery mail-user

  irc:
    name: deliver IRC push summary
    needs:
      - prepare
      - mail-user
    if: ${{ always() && needs.prepare.result == 'success' && vars.PUSH_DELIVERY_ENABLED == 'true' }}
    runs-on: ${{ fromJSON(vars.DELIVERY_RUNNER || '"ubuntu-latest"') }}
    permissions:
      contents: write

    steps:
      - name: Checkout automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download rendered delivery artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: push-delivery-${{ github.run_id }}
          path: push-delivery

      - name: Deliver IRC summary
        env:
          IRC_HOST: ${{ vars.IRC_HOST }}
          IRC_PORT: ${{ vars.IRC_PORT }}
          IRC_CHANNEL: ${{ vars.IRC_CHANNEL }}
          IRC_NICK: ${{ vars.IRC_NICK }}
          IRC_USERNAME: ${{ vars.IRC_USERNAME }}
          IRC_SASL_USERNAME: ${{ vars.IRC_SASL_USERNAME }}
          IRC_SASL_PASSWORD: ${{ secrets.IRC_SASL_PASSWORD }}
        run: python3 libexec/deliver-push.py push-delivery irc
